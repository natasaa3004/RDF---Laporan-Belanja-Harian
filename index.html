<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Belanja Harian</title>

<style>
body{
  font-family: Arial;
  background:#f4f6f9;
  padding:15px;
}

.container{
  max-width:500px;
  background:#fff;
  padding:20px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
  text-align:center;
}

input,button{
  width:100%;
  padding:10px;
  margin:7px 0;
  font-size:15px;
}

button{
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h2>🧾 Laporan Belanja Harian</h2>

<input id="tanggal" type="date">
<input id="nama" type="text" placeholder="Nama Karyawan">
<input id="barang" type="text" placeholder="Nama Barang">
<input id="jumlah" type="number" placeholder="Jumlah">
<input id="harga" type="number" placeholder="Harga Satuan">

<button onclick="kirim()">Simpan</button>

<p id="status"></p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbyI4GLv5_kX2_Y7Ub4xYa_q9O5E0tGPwZtgsmdjrinKfVAXhfDveaAdXQL5ZfYSxdVU9g/exec";

function kirim(){

  const formData = new FormData();

  formData.append("tanggal", document.getElementById("tanggal").value);
  formData.append("nama", document.getElementById("nama").value);
  formData.append("barang", document.getElementById("barang").value);
  formData.append("jumlah", document.getElementById("jumlah").value);
  formData.append("harga", document.getElementById("harga").value);

  fetch(scriptURL,{
    method:"POST",
    body: formData
  })

  .then(()=>{

    document.getElementById("status").innerHTML="✅ Berhasil disimpan";

    clearForm();

  })

  .catch(()=>{

    document.getElementById("status").innerHTML="❌ Gagal simpan";

  });

}

function clearForm(){

  document.getElementById("nama").value="";
  document.getElementById("barang").value="";
  document.getElementById("jumlah").value="";
  document.getElementById("harga").value="";

}

</script>

</body>
</html>
