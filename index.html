<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Belanja Harian</title>

<style>
body{
  font-family: Arial;
  background:#f4f6f9;
  padding:15px;
}

.container{
  max-width:500px;
  background:#fff;
  padding:20px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
  text-align:center;
}

input,button{
  width:100%;
  padding:10px;
  margin:7px 0;
  font-size:15px;
}

button{
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h2>🧾 Laporan Belanja Harian</h2>

<input id="tanggal" type="date">
<input id="nama" type="text" placeholder="Nama Karyawan">
<input id="barang" type="text" placeholder="Nama Barang">
<input id="jumlah" type="number" placeholder="Jumlah">
<input id="harga" type="number" placeholder="Harga Satuan">

<button onclick="kirim()">Simpan</button>

<p id="status"></p>

</div>

<script>

// AUTO TANGGAL HARI INI
document.getElementById("tanggal").valueAsDate = new Date();

// GANTI DENGAN URL SCRIPT KAMU
const scriptURL = "https://script.google.com/macros/s/AKfycbzajHJEenJvFDODqROlrCyEL3jt9VCfGJWqQBqkBwewbOhE2zB5FTSH5GQWbw5cppNezg/exec";

function kirim(){

  const data = {
    tanggal : document.getElementById("tanggal").value,
    nama    : document.getElementById("nama").value,
    barang  : document.getElementById("barang").value,
    jumlah  : document.getElementById("jumlah").value,
    harga   : document.getElementById("harga").value
  };

  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify(data),
    headers:{
      "Content-Type":"application/json"
    }
  })

  .then(res => res.text())
  .then(txt => {
    document.getElementById("status").innerHTML="✅ Berhasil disimpan";
    clearForm();
  })

  .catch(err=>{
    document.getElementById("status").innerHTML="❌ Gagal simpan";
  });
}

function clearForm(){
  document.getElementById("nama").value="";
  document.getElementById("barang").value="";
  document.getElementById("jumlah").value="";
  document.getElementById("harga").value="";
}

</script>

</body>
</html>
